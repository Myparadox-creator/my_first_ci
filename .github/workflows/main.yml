name: My First CI

on:
  push:
    branches: [ "main" ]

jobs:
  run-my-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the test script
        run: npm test
